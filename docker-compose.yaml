version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      SA_PASSWORD: "N5@Permissions"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/1433'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - n5-backend

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.6.1
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    volumes:
      - esdata:/usr/share/elasticsearch/data
    networks:
      - n5-backend

  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "echo", "ruok", "|", "nc", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - n5-backend

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - n5-backend

  permission-api:
    build:
      context: .
      dockerfile: src/Presentation/N5.Permissions.Api/Dockerfile
    depends_on:
      kafka:
        condition: service_started
      sqlserver:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=N5.Permissions;User Id=sa;Password=N5@Permissions;TrustServerCertificate=True;
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=permissions
    networks:
      - n5-backend

  permission-services:
    build:
      context: .
      dockerfile: src/Presentation/N5.Permissions.Services/Dockerfile
    environment:
      - Kafka__BootstrapServers=kafka:9092
      - Kafka__GroupId=permissions
      - ElasticSearch__Url=http://elasticsearch:9200
      - ElasticSearch__Index=permissions
    depends_on:
      kafka:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    networks:
      - n5-backend

networks:
  n5-backend:
    driver: bridge

volumes:
  sqlserver-data:
  esdata: